<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function sum(){
            let a = 10;
            let b = 20;
            let c = a + b;
            document.write("The sum of a and b is: " + c);
            console.log("The sum of a and b is: " + c);
        }
    </script>
</head>
<body>
    <button onclick="sum()">Calculate Sum</button>

</body>
</html>
